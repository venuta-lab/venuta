name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push replaces its run in progress; every commit on main keeps its
# own run, so its result is never thrown away.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine + cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The library engine is portable (phones come later); macOS minutes cost ten times as
        # much on a private repo, so it joins when there is a Mac build to check.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The keychain (Spotify sign-in) talks to the Secret Service over D-Bus on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy -p engine -p cli --all-targets -- -D warnings
      - run: cargo test -p engine -p cli

  app:
    name: desktop app (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app lint
      - run: pnpm --dir app typecheck
      - run: pnpm --dir app test
      # The release scripts: the update manifest every installed version reads.
      - run: node --test "scripts/tests/*.test.mjs"
      - run: node scripts/theme-docs.mjs --check
      - run: pnpm --dir app build
      # The player plays to memory in its tests, so no sound device is needed.
      - run: cargo clippy -p player -p app --all-targets -- -D warnings
      - run: cargo test -p player -p app
