[package]
name = "venuta-spike-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.91"
publish = false
description = "Throwaway Android spike: the Rust core behind one UniFFI facade, loaded from a minimal Kotlin app"

[lib]
name = "venuta_spike"
crate-type = ["cdylib", "rlib"]

[dependencies]
uniffi = { version = "=0.32.1", features = ["tokio"] }
engine.workspace = true
media-access = { workspace = true, features = ["live-provider"] }
player = { path = "../../crates/player" }
ytmusic = { path = "../../crates/ytmusic" }
together = { path = "../../crates/together" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
iroh = "1.3"
thiserror.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3"
