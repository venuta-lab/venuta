[package]
name = "app"
description = "Desktop shell: Tauri window, tray and commands over the engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
engine.workspace = true
rusqlite.workspace = true
player = { path = "../../crates/player" }
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
blake3.workspace = true
walkdir.workspace = true
urlencoding.workspace = true
tauri = { version = "2.12.3", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
souvlaki = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tauri-plugin-global-shortcut = "2"
image = { workspace = true, features = ["ico"] }

[target.'cfg(windows)'.dependencies]
# The app icon you choose, on the shortcuts that open Venuta.
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }

[dev-dependencies]
tempfile.workspace = true
