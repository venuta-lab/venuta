[package]
name = "app"
description = "Desktop shell: Tauri window, tray and commands over the engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
engine.workspace = true
lyrics-text.workspace = true
lyrics-translate.workspace = true
rusqlite.workspace = true
player = { path = "../../crates/player" }
# Live catalog is compiled into the desktop app and on by default (release + dev).
# Opt out with VENUTA_FAKE_CATALOG=1 for fixture-only runs.
media-access = { path = "../../crates/media-access", features = ["live-provider"] }
phone-server = { path = "../../crates/phone-server" }
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
blake3.workspace = true
walkdir.workspace = true
urlencoding.workspace = true
tauri = { version = "2.12.3", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
souvlaki = "0.8"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tauri-plugin-global-shortcut = "2"
image = { workspace = true, features = ["ico"] }
tauri-plugin-notification = "2"
together = { path = "../../crates/together" }
together-net = { path = "../../crates/together-net" }
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tauri-plugin-deep-link = "2"

[target.'cfg(windows)'.dependencies]
# The app icon you choose, on the shortcuts that open Venuta.
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[dev-dependencies]
tempfile.workspace = true
