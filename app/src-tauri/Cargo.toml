[package]
name = "app"
description = "Desktop shell: Tauri window, tray and commands over the engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
engine.workspace = true
rusqlite.workspace = true
player = { path = "../../crates/player" }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
walkdir.workspace = true
tauri = { version = "2.12.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.8"
souvlaki = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
