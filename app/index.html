<!doctype html>
<!-- No spellcheck anywhere: fields here hold names, artists and lyrics (often Hindi in Roman letters), where it only draws false red lines. -->
<html lang="en" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No referrer on anything the window loads. The catalog's picture host rate-limits
         browser requests that name a foreign page (this window's address), so with one, covers
         failed to load in bursts; without, they load every time. Nothing here needs one. -->
    <meta name="referrer" content="no-referrer" />
    <title>Venuta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
