[package]
name = "ytmusic"
description = "YouTube Music (InnerTube) client: search, suggestions, browse, player, radio, lyrics"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "http2"] }
tokio = { version = "1", features = ["time", "sync"] }
sha1 = "0.10"
hex = "0.4"
urlencoding = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util", "net", "io-util"] }

[features]
# Opt-in live-YouTube smoke tests, never in the default `cargo test` run.
integration-tests = []
