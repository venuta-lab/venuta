[package]
name = "lyrics-text"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Second lines for lyrics: a sung line in another script, said in English letters, timed by the original's words. Pure: no platform code (Android reuses it); the network only to fetch the Japanese dictionary when asked"

[features]
default = ["japanese", "download"]
# Kanji readings through lindera and its IPADIC dictionary (not bundled: see `japanese::dictionary`).
japanese = ["dep:lindera", "dep:sha2", "dep:zip"]
# Fetches the Japanese dictionary over HTTPS the first time it is needed.
download = ["japanese", "dep:ureq"]

[dependencies]
serde.workspace = true
unicode-normalization.workspace = true
thiserror.workspace = true
# Mandarin pinyin with phrase-aware polyphones (MIT). Pinned: the gate tests read its output.
pinyin_pro = "=3.29.4"
lindera = { version = "=6.2.0", optional = true }
sha2 = { version = "0.10", optional = true }
zip = { version = "4.6.1", default-features = false, features = ["deflate"], optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[[example]]
name = "ipadic"
required-features = ["download"]
