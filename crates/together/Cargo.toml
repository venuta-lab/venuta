[package]
name = "together"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Venuta's listen together rooms: the messages, the room the host keeps, the shared clock and the invite. Pure: no network or audio here (the app carries them)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
blake3.workspace = true
arc-swap = "1.9.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Performance"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile.workspace = true
