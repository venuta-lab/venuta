[package]
name = "engine"
description = "Library engine: index, audit, rules, apply, sync. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
lofty.workspace = true
rusqlite.workspace = true
blake3.workspace = true
xxhash-rust.workspace = true
walkdir.workspace = true
rayon.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
lyrics-text.workspace = true
lyrics-translate = { workspace = true, features = ["bergamot", "download"] }
media-access.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
symphonia.workspace = true
rusty-chromaprint.workspace = true
image.workspace = true
realfft.workspace = true
regex.workspace = true
ureq.workspace = true
urlencoding.workspace = true
aes.workspace = true
flate2.workspace = true
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
globset.workspace = true
toml.workspace = true
ebur128.workspace = true
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
rubato = "5.0.1"
flacenc = "0.5.1"

[dev-dependencies]
tempfile.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Variant", "Win32_System_SystemInformation"] }
windows-sys.workspace = true
