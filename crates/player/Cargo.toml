[package]
name = "player"
description = "Venuta's audio engine: bit-perfect, gapless playback of your own files"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
live-provider = ["media-access/live-provider"]

[dependencies]
media-access = { path = "../media-access", features = ["live-provider"] }
symphonia = { workspace = true, features = ["flac", "mp3", "aac", "alac", "isomp4", "wav", "aiff", "pcm", "vorbis", "ogg", "mkv"] }
# Opus (the catalog's better stream, and local .opus files) through the reference libopus.
# Building it needs CMake, which comes with Visual Studio's C++ build tools.
symphonia-adapter-libopus = "0.3"
serde = { workspace = true }
# The drift remembered per output, in its file (drift_memory.rs).
serde_json.workspace = true
ureq.workspace = true
rand = "0.9"
md-5 = "0.10"
# The PCM hash of an alignment envelope (analysis.rs).
blake3.workspace = true
# The Listen together contracts (time, clock map, the room's hold on the player).
together = { path = "../together" }

[target.'cfg(windows)'.dependencies]
wasapi = "0.19"
# The same version wasapi uses: MMCSS for the player's threads, and the output's own WASAPI
# client (wasapi_out.rs): audio interfaces, COM, events.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Performance", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties", "Win32_UI_Shell_PropertiesSystem", "Win32_Security"] }
# The notification client's `implement` macro names this crate (the version wasapi uses).
windows-core = "0.61"

[dev-dependencies]
media-access = { path = "../media-access" }
tempfile.workspace = true
audio-check = { path = "../audio-check" }


[[example]]
name = "live_remote_decode"
required-features = ["live-provider"]

