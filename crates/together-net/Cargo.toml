[package]
name = "together-net"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Venuta's listen together connections: the iroh endpoint and how it reaches others, the host's door and serving, a guest's connect and reconnect, and the host's files and covers streamed. No window and no audio here"

[dependencies]
together = { path = "../together" }
iroh = "1.3"
iroh-tickets = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util", "net", "fs"] }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
getrandom = "0.3"

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
